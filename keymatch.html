<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키맞추기 — 대장단지 따라가기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#EEF1F6;
    --paper:#FFFFFF;
    --ink:#14181F;
    --ink-soft:#5B6472;
    --ink-faint:#9AA3B2;
    --indigo:#26326B;
    --indigo-deep:#171E3D;
    --gold:#B9832A;
    --gold-soft:#F4E6C4;
    --brick:#B24A3D;
    --brick-soft:#F3DFDA;
    --sage:#5C7A5F;
    --sage-soft:#DEE8DE;
    --line:#E1E5EC;
    --radius:22px;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .serif{ font-family:'Noto Serif KR', serif; }

  /* ---------- Brand header / signature ---------- */
  .brandmark{
    width:100%;
    max-width:420px;
    text-align:center;
    margin-bottom:22px;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:7px;
    height:56px;
    margin:0 auto 14px;
    position:relative;
  }
  .bars::after{
    content:'';
    position:absolute;
    left:-6px; right:-6px; top:2px;
    height:0;
    border-top:1.5px dashed var(--indigo);
    opacity:.55;
  }
  .bar{
    width:9px;
    background:var(--gold);
    border-radius:3px 3px 0 0;
    transform-origin:bottom;
    animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  .bar.lead{ background:var(--indigo); }
  .bar:nth-child(1){height:34px; animation-delay:.02s}
  .bar:nth-child(2){height:44px; animation-delay:.08s}
  .bar:nth-child(3){height:29px; animation-delay:.14s}
  .bar:nth-child(4){height:54px; animation-delay:.2s}
  .bar:nth-child(5){height:39px; animation-delay:.26s}
  .bar:nth-child(6){height:54px; animation-delay:.32s}
  .bar:nth-child(7){height:31px; animation-delay:.38s}
  @keyframes rise{ from{ transform:scaleY(0); opacity:0 } to{ transform:scaleY(1); opacity:1 } }
  @media (prefers-reduced-motion: reduce){ .bar{ animation:none; } }

  h1.title{
    font-size:1.9rem;
    font-weight:900;
    letter-spacing:-.02em;
    color:var(--indigo-deep);
  }
  p.subtitle{
    font-size:.92rem;
    color:var(--ink-soft);
    margin-top:4px;
    font-weight:500;
    letter-spacing:-.01em;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:8px;
    width:100%;
    max-width:420px;
    margin-bottom:18px;
  }
  .tab{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:9px 6px;
    text-align:center;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab .num{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color:var(--ink-faint);
    margin-bottom:2px;
  }
  .tab .lbl{
    font-size:.78rem;
    font-weight:600;
    color:var(--ink-soft);
  }
  .tab.active{
    background:var(--indigo-deep);
    border-color:var(--indigo-deep);
  }
  .tab.active .num{ color:var(--gold); }
  .tab.active .lbl{ color:#fff; }

  /* ---------- Phone frame ---------- */
  .frame{
    width:390px;
    max-width:100%;
    height:780px;
    max-height:82vh;
    background:var(--indigo-deep);
    border-radius:44px;
    padding:12px;
    box-shadow:0 30px 60px -20px rgba(23,30,61,.35), 0 2px 0 rgba(23,30,61,.06);
  }
  .screen-wrap{
    width:100%;
    height:100%;
    background:var(--bg);
    border-radius:32px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 22px 4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    color:var(--ink);
    font-weight:600;
    flex-shrink:0;
  }
  .statusbar .dots{ display:flex; gap:3px; align-items:center; }
  .statusbar .dots span{ width:4px; height:4px; border-radius:50%; background:var(--ink); display:block; }

  .screen{
    flex:1;
    overflow-y:auto;
    padding:6px 18px 28px;
    display:none;
  }
  .screen.active{ display:block; }
  .screen::-webkit-scrollbar{ width:0; }

  @media (max-width:480px){
    body{ padding:20px 0 40px; }
    .brandmark, .tabs{ padding:0 16px; }
    .frame{ width:100%; height:calc(100vh - 210px); min-height:560px; border-radius:0; padding:0; box-shadow:none; }
    .screen-wrap{ border-radius:0; }
  }

  /* ---------- shared UI bits ---------- */
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .locbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0 14px;
  }
  .locbar .loc{ font-weight:700; font-size:1rem; }
  .locbar .loc span{ color:var(--ink-faint); font-weight:500; font-size:.86rem; }
  .chip{
    font-size:.7rem;
    background:var(--paper);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:999px;
    color:var(--ink-soft);
    font-weight:600;
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
  }
  .leader-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--indigo-deep);
    color:var(--gold-soft);
    font-size:.66rem;
    font-weight:700;
    padding:4px 9px 4px 8px;
    border-radius:999px;
    margin-bottom:10px;
    letter-spacing:.02em;
  }
  .leader-badge::before{ content:'★'; color:var(--gold); font-size:.7rem; }

  .complex-name{ font-size:1.28rem; font-weight:800; letter-spacing:-.01em; margin-bottom:2px; }
  .complex-meta{ font-size:.78rem; color:var(--ink-soft); margin-bottom:14px; }

  .price-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:2px; }
  .price{ font-family:'IBM Plex Mono', monospace; font-size:1.9rem; font-weight:600; letter-spacing:-.02em; }
  .delta{ font-family:'IBM Plex Mono', monospace; font-size:.85rem; font-weight:600; padding:3px 8px; border-radius:8px; }
  .delta.up{ color:var(--sage); background:var(--sage-soft); }
  .price-label{ font-size:.72rem; color:var(--ink-faint); margin-bottom:14px; }

  /* chart */
  .chart-legend{ display:flex; gap:14px; margin-bottom:6px; font-size:.72rem; color:var(--ink-soft); font-weight:600;}
  .chart-legend .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  svg.chart{ width:100%; display:block; overflow:visible; }
  .regime-labels{ display:flex; margin-top:6px; gap:2px; }
  .regime-labels .rl{
    font-size:.6rem; color:var(--ink-soft); text-align:center; font-weight:600; line-height:1.25;
    cursor:pointer; padding:5px 2px 6px; border-radius:8px; border:1px dashed transparent;
    transition:background .12s ease;
  }
  .regime-labels .rl:active{ background:var(--paper); border-color:var(--line); }
  .regime-labels .rl .q{
    display:inline-flex; align-items:center; justify-content:center;
    width:12px; height:12px; border-radius:50%;
    background:var(--indigo-deep); color:var(--gold-soft);
    font-size:.52rem; font-weight:800; margin-top:2px;
  }

  /* ---------- policy modal ---------- */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(20,24,31,.5);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50; border-radius:32px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-sheet{
    width:100%; background:var(--paper);
    border-radius:22px 22px 0 0;
    padding:20px 20px 24px;
    animation:slideup .2s ease;
    max-height:74%;
    overflow-y:auto;
  }
  @keyframes slideup{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-handle{ width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px; }
  .modal-eyebrow{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.66rem;
    color:var(--ink-faint); margin-bottom:6px; letter-spacing:.03em;
  }
  .modal-title{ font-size:1.15rem; font-weight:800; margin-bottom:2px; }
  .modal-tint{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .modal-range{ font-family:'IBM Plex Mono', monospace; font-size:.74rem; color:var(--ink-soft); margin-bottom:12px; }
  .modal-desc{ font-size:.86rem; line-height:1.62; color:var(--ink); margin-bottom:10px; }
  .modal-desc b{ color:var(--indigo-deep); }
  .modal-close{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:11px; font-weight:700; font-size:.84rem; color:var(--ink-soft); margin-top:6px; cursor:pointer;
  }

  .cta{
    width:100%;
    background:var(--indigo-deep);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:14px;
    font-size:.9rem;
    font-weight:700;
    font-family:'Pretendard', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    margin-top:4px;
  }
  .cta span.n{ color:var(--gold); }

  /* screen 2: list */
  .filters{ display:flex; gap:7px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .filters .chip.on{ background:var(--indigo-deep); border-color:var(--indigo-deep); color:#fff; }

  .unit-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .unit-card:active{ background:var(--bg); }
  .unit-card.selected{
    border-color:var(--indigo-deep);
    box-shadow:0 0 0 1.5px var(--indigo-deep) inset;
  }
  .unit-card.selected .unit-name::after{
    content:'선택됨';
    display:inline-block;
    margin-left:7px;
    font-size:.6rem;
    font-weight:800;
    color:var(--indigo-deep);
    background:var(--gold-soft);
    padding:2px 6px;
    border-radius:6px;
    vertical-align:middle;
  }
  .unit-left{ flex:1; min-width:0; }
  .unit-name{ font-weight:700; font-size:.94rem; margin-bottom:3px; }
  .unit-meta{ font-size:.7rem; color:var(--ink-faint); margin-bottom:8px; }
  .sync-dots{ display:flex; gap:4px; align-items:center; }
  .sync-dots .d{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .sync-dots .d.on{ background:var(--gold); }
  .sync-dots .d.na{ background:repeating-linear-gradient(45deg, var(--ink-faint), var(--ink-faint) 1px, transparent 1px, transparent 2px); }
  .sync-dots .txt{ font-size:.68rem; color:var(--ink-soft); font-weight:700; margin-left:4px; }

  .unit-right{ text-align:right; flex-shrink:0; }
  .unit-price{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.98rem; }
  .unit-gap{ font-family:'IBM Plex Mono', monospace; font-size:.76rem; font-weight:700; color:var(--gold); margin-top:3px; }
  .unit-spark{ width:64px; height:22px; margin-top:6px; }

  /* screen 3: compare */
  .backrow{ display:flex; align-items:center; gap:8px; padding:8px 0 4px; font-size:.82rem; color:var(--ink-soft); font-weight:600; }
  .compare-header{ margin-bottom:12px; }
  .vs-row{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .vs-row .who{ font-size:.85rem; font-weight:700; }
  .vs-row .who.lead{ color:var(--indigo); }
  .vs-row .who.sync{ color:var(--gold); }
  .vs-row .p{ font-family:'IBM Plex Mono', monospace; font-size:.85rem; font-weight:600; margin-left:auto; }

  .badge-grid{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .badge-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:12px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .badge-row .mark{
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; font-weight:800; color:#fff; flex-shrink:0;
  }
  .badge-row .mark.on{ background:var(--sage); }
  .badge-row .mark.off{ background:var(--ink-faint); }
  .badge-row .mark.na{ background:var(--ink-faint); opacity:.5; }
  .badge-row .info{ flex:1; }
  .badge-row .rname{ font-size:.8rem; font-weight:700; }
  .badge-row .rperiod{ font-size:.66rem; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; }

  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .info-item{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .info-item .k{ font-size:.66rem; color:var(--ink-faint); margin-bottom:3px; font-weight:600; }
  .info-item .v{ font-size:.86rem; font-weight:700; font-family:'IBM Plex Mono', monospace; }

  .section-title{ font-size:.98rem; font-weight:800; margin:18px 0 10px; }
</style>
</head>

        <div class="section-title">국면별 동조 여부</div>
        <div class="badge-grid" id="badgeGrid"></div>

        <div class="section-title">단지 정보</div>
        <div class="info-grid" id="infoGrid"></div>
      </div>

      <!-- ===================== POLICY MODAL ===================== -->
      <div class="modal-overlay" id="policyModal">
        <div class="modal-sheet">
          <div class="modal-handle"></div>
          <span class="modal-eyebrow" id="modalEyebrow">국면 01</span>
          <div class="modal-title"><span class="modal-tint" id="modalTint"></span><span id="modalTitle"></span></div>
          <div class="modal-range" id="modalRange"></div>
          <div class="modal-desc" id="modalDesc"></div>
          <button class="modal-close" id="modalClose">닫기</button>
        </div>
      </div>

    </div>
  </div>

<script>
  // ---------- tab switching ----------
  function goToScreen(target){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.target===target));
    document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===target));
  }
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=> goToScreen(tab.dataset.target));
  });
  document.getElementById('ctaToList').addEventListener('click', ()=> goToScreen('list'));
  document.getElementById('backToDashboard').addEventListener('click', ()=> goToScreen('dashboard'));
  document.getElementById('backToList').addEventListener('click', ()=> goToScreen('list'));

  // ---------- regime definitions ----------
  // 국면 시작/종료를 'YYYYMM' 문자열로만 정의하고 period/full/width는 여기서 계산함.
  // 마지막 국면(진행중)은 endYm에 'now'를 넣으면 오늘 기준 현재월로 자동 추적됨 —
  // 예전엔 종료월(2026.08)이 하드코딩돼 있어서 시간 지나면 그대로 낡아버렸음
  // (2026-09-01, 사용자 지적으로 발견).
  function nowYm(){
    // 보는 사람 브라우저의 로컬 시간대가 아니라 KST 기준 현재월 — batch_runner.py의
    // CURRENT_YM과 같은 기준이라야 백엔드가 구운 데이터 타임라인과 안 어긋남.
    const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
    return `${kst.getUTCFullYear()}${String(kst.getUTCMonth()+1).padStart(2,'0')}`;
  }
  function fmtYm(ym){ return ym.slice(2,4)+'.'+ym.slice(4); }
  function fmtYmFull(ym){ return ym.slice(0,4)+'.'+ym.slice(4); }
  function ymMonthSpan(startYm, endYm){
    const sy=+startYm.slice(0,4), sm=+startYm.slice(4);
    const ey=+endYm.slice(0,4), em=+endYm.slice(4);
    return (ey-sy)*12 + (em-sm) + 1;
  }

  const regimeDefs = [
    {
      label:'규제강화기', startYm:'201705', endYm:'201912', tint:'#F3DFDA', dot:'#B24A3D',
      desc:`문재인 정부 초중반 고강도 수요 억제기예요. <b>8.2대책(2017)</b>과 <b>9.13대책(2018)</b>으로 투기과열지구·조정대상지역이 확대 지정되고, 다주택자 양도세 중과와 종합부동산세 강화, LTV·DTI 대출규제가 이어졌어요. 이후 <b>12.16대책(2019)</b>까지 규제가 누적된 구간이에요.`
    },
    {
      label:'급등기', startYm:'202001', endYm:'202204', tint:'#DEE8DE', dot:'#5C7A5F',
      desc:`<b>임대차3법(2020.07 시행)</b>으로 계약갱신청구권·전월세상한제·전월세신고제가 도입됐고, 6·17·7·10대책으로 종부세 최고세율이 인상됐어요. 동시에 저금리 기조와 유동성 확대가 겹치며 전국적으로 가격이 급등한 국면이에요.`
    },
    {
      label:'하락기', startYm:'202205', endYm:'202312', tint:'#F3DFDA', dot:'#B24A3D',
      desc:`윤석열 정부 출범(2022.05)과 함께 한국은행의 급격한 기준금리 인상이 맞물리며 거래가 급감하고 가격이 조정된 구간이에요. <b>2023.1.3대책</b>으로 강남3구·용산을 제외한 규제지역이 대부분 해제됐고, <b>특례보금자리론(2023.01.30 접수 개시)</b>이 하락세를 진정시켰어요.`
    },
    {
      // 2025.06 6.27대책 전까지만 — 그 이후는 성격이 달라져서 재규제기로 분리함.
      label:'회복기', startYm:'202401', endYm:'202506', tint:'#F4E6C4', dot:'#B9832A',
      desc:`<b>스트레스 DSR 2단계(2024)</b>가 적용되긴 했지만, 재건축·정비사업 규제완화가 병행되며 강남권 등 핵심 입지를 중심으로 가격이 반등한 구간이에요. <b>6·27대책(2025.06.27)</b> 발표 전까지로, 대출 규제보다 공급 기대감이 더 크게 작용했어요.`
    },
    {
      // 진행중 — endYm을 'now'로 열어두면 매달 자동 갱신.
      label:'재규제기', startYm:'202507', endYm: nowYm(), tint:'#F3DFDA', dot:'#B24A3D',
      desc:`<b>6·27대책(2025.06.27)</b>으로 수도권·규제지역 주택담보대출 한도가 6억원으로 처음 제한되고, 다주택자 추가 주담대가 전면 금지됐어요. 7월 <b>스트레스 DSR 3단계</b> 적용에 이어 <b>10·15대책</b>으로 서울 전역과 경기 12개 지역이 규제지역으로 확대 지정되며, 강남3구 거래량도 큰 폭으로 줄었어요.`
    },
  ];
  const regimes = regimeDefs.map(r => ({
    ...r,
    period: `${fmtYm(r.startYm)}–${fmtYm(r.endYm)}`,
    full: `${fmtYmFull(r.startYm)} – ${fmtYmFull(r.endYm)}`,
    width: ymMonthSpan(r.startYm, r.endYm),
  }));
  const total = regimes.reduce((a,r)=>a+r.width,0);
  let acc = 0;
  const bounds = regimes.map(r=>{ const s=acc/total; acc+=r.width; return {...r, start:s, end:acc/total}; });

  // ---------- 파이프라인 산출 데이터 로드 ----------
  // batch_runner.py → export_for_frontend.py가 실제 DB(keymatch.db)에서 뽑아낸 값.
  // 하드코딩된 mock 배열이 아니라 국토부 API 파이프라인 → 동조판정 엔진을 거친 결과임.
  // shape: { regions:[{code,label}], defaultRegion, data:{ [region_code]: {leader, units} } }
  const pipelineData = JSON.parse(document.getElementById('pipelineData').textContent);
  let leaderPts, leaderPrice, units, selectedUnitId;

  function fmtEok(v){ return v.toFixed(1)+'억'; }

  function sparkPoints(pts){
    const vals = pts.map(p=>p[1]);
    const min = Math.min(...vals), max = Math.max(...vals);
    return pts.map(p=>{
      const x = (p[0]*100).toFixed(1);
      const y = (28 - ((p[1]-min)/(max-min))*24 - 2).toFixed(1);
      return `${x},${y}`;
    }).join(' ');
  }

  // ---------- 지역 전환 ----------
  // "지역 변경" select는 상시 그 문구를 보여주는 트리거 — 고르면 즉시 loadRegion()
  // 실행하고 선택을 리셋함. 현재 지역 표시는 위의 .loc 라벨이 맡음.
  function loadRegion(code){
    const regionData = pipelineData.data[code];
    if(!regionData){ console.warn('알 수 없는 region_code', code); return; }

    leaderPts = regionData.leader.pts;
    leaderPrice = { current: regionData.leader.currentPrice, name: regionData.leader.name, meta: regionData.leader.meta };
    units = regionData.units;
    selectedUnitId = units[0].id;

    const meta = pipelineData.regions.find(r=>r.code===code);
    document.getElementById('locLabel').innerHTML = `${meta ? meta.label : code} <span>▾</span>`;

    document.getElementById('leaderName').textContent = leaderPrice.name;
    document.getElementById('leaderMeta').textContent = leaderPrice.meta;
    document.getElementById('leaderPrice').textContent = fmtEok(leaderPrice.current);
    document.getElementById('leaderLegendName').textContent = leaderPrice.name;
    document.getElementById('listLeaderName').textContent = leaderPrice.name;
    document.getElementById('compareLeaderName').textContent = leaderPrice.name;
    document.getElementById('compareLeaderPrice').textContent = fmtEok(leaderPrice.current);
    document.getElementById('ctaCount').textContent = `${units.length}개`;
    {
      const startIdx = leaderPts[0][1], endIdx = leaderPts[leaderPts.length-1][1];
      const totalReturn = (endIdx/startIdx - 1) * 100;
      document.getElementById('leaderDelta').textContent = `${totalReturn>=0?'+':''}${totalReturn.toFixed(1)}%`;
      document.getElementById('leaderPriceLabel').textContent = '2017.05 → 2026.08 실거래가 지수 (base=100)';
    }

    renderUnitList();
    renderChart('chart1', [{pts:leaderPts, color:'#26326B'}]);
    renderCompare();
  }

  const regionSelect = document.getElementById('regionSelect');
  regionSelect.innerHTML = '<option value="" selected disabled hidden>지역 변경</option>' +
    pipelineData.regions.map(r=>`<option value="${r.code}">${r.label}</option>`).join('');
  regionSelect.addEventListener('change', ()=>{
    if(!regionSelect.value) return;
    loadRegion(regionSelect.value);
    regionSelect.selectedIndex = 0;
  });

  // ---------- 동조단지 목록 필터/정렬 ----------
  // 완전/부분 동조는 syncFlags(국면별 동조여부, null=판정불가)를 기준으로 거름.
  // 갭/세대수 정렬은 이미 문자열로 포맷된 필드(u.gap, u.info.households)에서
  // 숫자만 다시 뽑아 씀 — 백엔드가 별도 숫자 필드를 안 내려줘도 프론트에서 바로 됨.
  let listMode = 'full';
  function unitGapAbs(u){
    const m = String(u.gap).replace(/−/g, '-').match(/-?[\d.]+/);
    return m ? Math.abs(parseFloat(m[0])) : 0;
  }
  function unitHouseholds(u){
    const m = String(u.info.households).replace(/,/g, '').match(/\d+/);
    return m ? parseInt(m[0], 10) : 0;
  }
  document.querySelectorAll('#listFilters .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#listFilters .chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
      listMode = chip.dataset.mode;
      renderUnitList();
    });
  });

  function renderUnitList(){
    const wrap = document.getElementById('unitList');
    let list = units;
    if(listMode === 'full'){
      list = units.filter(u => u.syncFlags.filter(f=>f===true).length === regimes.length);
    } else if(listMode === 'partial'){
      list = units.filter(u => u.syncFlags.filter(f=>f===true).length >= 3);
    } else if(listMode === 'gapAsc'){
      list = [...units].sort((a,b)=> unitGapAbs(a) - unitGapAbs(b));
    } else if(listMode === 'householdsDesc'){
      list = [...units].sort((a,b)=> unitHouseholds(b) - unitHouseholds(a));
    }
    if(list.length === 0){
      wrap.innerHTML = `<div style="padding:40px 4px;text-align:center;color:var(--ink-faint);font-size:.86rem;">조건에 맞는 동조단지가 없어요</div>`;
      return;
    }
    wrap.innerHTML = list.map(u=>{
      const judgable = u.syncFlags.filter(f=>f!==null).length;
      const syncCount = u.syncFlags.filter(f=>f===true).length;
      const dots = u.syncFlags.map(f=>`<span class="d ${f===true?'on':(f===null?'na':'')}"></span>`).join('');
      return `
        <div class="unit-card ${u.id===selectedUnitId?'selected':''}" data-id="${u.id}">
          <div class="unit-left">
            <div class="unit-name">${u.name}</div>
            <div class="unit-meta">${u.meta}</div>
            <div class="sync-dots">${dots}<span class="txt">${syncCount}/${judgable} 국면 동조</span></div>
          </div>
          <div class="unit-right">
            <div class="unit-price">${fmtEok(u.currentPrice)}</div>
            <div class="unit-gap">${u.gap}</div>
            <svg class="unit-spark" viewBox="0 0 100 30"><polyline points="${sparkPoints(u.pts)}" fill="none" stroke="#B9832A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>`;
    }).join('');
    wrap.querySelectorAll('.unit-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        selectedUnitId = card.dataset.id;
        renderUnitList();
        renderCompare();
        goToScreen('compare');
      });
    });
  }

  function renderCompare(){
    const u = units.find(x=>x.id===selectedUnitId);
    const judgable = u.syncFlags.filter(f=>f!==null).length;
    const syncCount = u.syncFlags.filter(f=>f===true).length;
    document.getElementById('compareUnitName').textContent = u.name;
    document.getElementById('compareUnitName2').textContent = '● ' + u.name;
    document.getElementById('comparePrice').textContent = fmtEok(u.currentPrice);
    document.getElementById('compareSummary').textContent = `현재 갭 ${u.gap} · ${syncCount}개 국면 동조 (판정가능 ${judgable}개 중)`;
    renderChart('chart2', [{pts:leaderPts, color:'#26326B'}, {pts:u.pts, color:'#B9832A'}]);

    const badgeGrid = document.getElementById('badgeGrid');
    badgeGrid.innerHTML = bounds.map((b,i)=>{
      const f = u.syncFlags[i];
      const markClass = f===true ? 'on' : (f===null ? 'na' : 'off');
      const markText = f===true ? '✓' : (f===null ? '−' : '✕');
      return `
      <div class="badge-row">
        <div class="mark ${markClass}">${markText}</div>
        <div class="info">
          <div class="rname">${b.label}</div>
          <div class="rperiod">${b.period}</div>
        </div>
      </div>`;
    }).join('');

    const infoGrid = document.getElementById('infoGrid');
    infoGrid.innerHTML = `
      <div class="info-item"><div class="k">세대수</div><div class="v">${u.info.households}</div></div>
      <div class="info-item"><div class="k">준공년도</div><div class="v">${u.info.year}</div></div>
      <div class="info-item"><div class="k">기준 평형</div><div class="v">${u.info.size}</div></div>
      <div class="info-item"><div class="k">최근 거래</div><div class="v">${u.info.recent}</div></div>
    `;
  }

  function renderChart(svgId, series, showRegimes){
    const svg = document.getElementById(svgId);
    const W=340,H=150, padL=6, padR=6, padT=10, padB=6;
    const allVals = series.flatMap(s=>s.pts.map(p=>p[1]));
    const min=Math.min(...allVals), max=Math.max(...allVals);
    const x = t => padL + t*(W-padL-padR);
    const y = v => padT + (1-(v-min)/(max-min))*(H-padT-padB);

    let svgContent = '';
    // regime background bands (clickable)
    bounds.forEach((b,i)=>{
      svgContent += `<rect class="regime-hit" data-idx="${i}" x="${x(b.start)}" y="0" width="${x(b.end)-x(b.start)}" height="${H}" fill="${b.tint}" opacity="0.55" style="cursor:pointer;"/>`;
    });
    // divider lines
    bounds.slice(1).forEach(b=>{
      svgContent += `<line x1="${x(b.start)}" y1="0" x2="${x(b.start)}" y2="${H}" stroke="#C9CFDA" stroke-width="1" stroke-dasharray="2,3"/>`;
    });
    // lines
    series.forEach(s=>{
      const pts = s.pts.map(p=>`${x(p[0])},${y(p[1])}`).join(' ');
      svgContent += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      const last = s.pts[s.pts.length-1];
      svgContent += `<circle cx="${x(last[0])}" cy="${y(last[1])}" r="3.6" fill="${s.color}"/>`;
    });
    svg.innerHTML = svgContent;
    svg.querySelectorAll('.regime-hit').forEach(rect=>{
      rect.addEventListener('click', ()=> openPolicyModal(parseInt(rect.dataset.idx, 10)));
    });
  }

  function renderRegimeLabels(id){
    const el = document.getElementById(id);
    el.innerHTML = bounds.map((b,i)=>
      `<div class="rl" style="flex:${b.width}" data-idx="${i}">${b.label}<br>${b.period}<br><span class="q">?</span></div>`
    ).join('');
    el.querySelectorAll('.rl').forEach(node=>{
      node.addEventListener('click', ()=> openPolicyModal(parseInt(node.dataset.idx, 10)));
    });
  }
  renderRegimeLabels('regimeLabels1');
  renderRegimeLabels('regimeLabels2');

  // ---------- policy modal ----------
  function openPolicyModal(idx){
    const r = regimes[idx];
    const screenWrap = document.querySelector('.screen.active') ? document.querySelector('.screen.active').closest('.screen-wrap') : document.querySelector('.screen-wrap');
    document.getElementById('modalEyebrow').textContent = `국면 ${String(idx+1).padStart(2,'0')} · ${regimes.length}개 중`;
    document.getElementById('modalTitle').textContent = r.label;
    document.getElementById('modalTint').style.background = r.dot;
    document.getElementById('modalRange').textContent = r.full;
    document.getElementById('modalDesc').innerHTML = r.desc;
    document.getElementById('policyModal').classList.add('show');
  }
  document.getElementById('modalClose').addEventListener('click', ()=>{
    document.getElementById('policyModal').classList.remove('show');
  });
  document.getElementById('policyModal').addEventListener('click', (e)=>{
    if(e.target.id==='policyModal') e.target.classList.remove('show');
  });

  // ---------- initial render ----------
  loadRegion(pipelineData.defaultRegion);
</script>
